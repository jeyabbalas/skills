<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
  body{margin:0;font:1.125rem/1.65 Georgia,serif;color:#1F2328;background:#FAF9F6}
  .page{max-width:46rem;margin:0 auto;padding:1.2rem 1.25rem 3rem}
  .beyond{border-left:3px solid #C99A2E;background:#FBF4E1;padding:.85rem 1.1rem}
  img{max-width:100%}
</style>
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/paper-reader.css">
<script defer src="{{ASSET_PREFIX}}assets/paper-reader.js"></script>
</head>
<body>
<main class="page">

  <header class="masthead chrome">
    <nav class="crumbs" aria-label="Breadcrumb">{{BREADCRUMB}}</nav>
    <span class="chip">{{PASS_BADGE}}</span>
  </header>

  <h1>{{TITLE}}</h1>
  <p class="subtitle"><!-- slot: subtitle — authors · venue · year --></p>

  <p class="passes">
    <!-- slot: passes — e.g.
      <span class="done">● Pass 1</span> <span class="now">◐ Pass 2</span> <span class="todo">○ Pass 3</span> -->
  </p>

  <!-- slot: goal — one short paragraph: the reader’s goal for this paper (verbatim from PAPER.md) -->

  <section class="dir">
    <!-- slot: rows — one row per artifact, in reading order; state = pass + done/in progress/—.
      <div class="dir-row"><span class="what"><a href="profile.html">Paper profile</a></span>
        <span class="state">Pass 1 · done</span></div>
      <div class="dir-row"><span class="what"><a href="paper.pdf">paper.pdf</a></span>
        <span class="state">source</span></div>
    -->
  </section>

  <footer class="colophon">Generated by three-pass · paper hub · {{GENERATED_DATE}}. Written by an AI reading companion. Unmarked content restates the paper; anything marked “Beyond the paper” is added interpretation. Verify against the original PDF before citing. · <a href="{{SISTER_MD}}">Markdown version</a></footer>

</main>
</body>
</html>
