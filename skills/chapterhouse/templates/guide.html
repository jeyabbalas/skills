<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<!-- failsafe: keeps a stray single-file copy readable; the real stylesheet below overrides it -->
<style>
  body{margin:0;font:1.125rem/1.65 Georgia,serif;color:#1F2328;background:#FAF9F6}
  .page{max-width:46rem;margin:0 auto;padding:1.2rem 1.25rem 3rem}
  .beyond{border-left:3px solid #C99A2E;background:#FBF4E1;padding:.85rem 1.1rem}
  img{max-width:100%}
</style>
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/book-study.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js"></script>
<script defer src="{{ASSET_PREFIX}}assets/book-study.js"></script>
</head>
<body data-math>
<main class="page">

  <header class="masthead chrome">
    <nav class="crumbs" aria-label="Breadcrumb">{{BREADCRUMB}}</nav>
    <span class="chip">{{PASS_BADGE}}</span>
  </header>

  <h1>{{TITLE}}</h1>
  <p class="subtitle"><!-- slot: subtitle — for: §N.M (pp. A–B) · one line on what this guide prepares --></p>

  <aside class="beyond" data-kind="context">
    <p class="beyond-kicker">◆ Beyond the book</p>
    <p><!-- slot: banner — the guide's lead blockquote from the sister markdown: this
      entire page is the study partner's teaching, written to prepare the student's own
      read, and the book's words appear only inside quotation marks with page anchors. --></p>
  </aside>

  <!-- slot: content — the guide body, sections in the sister's order (GUIDE-FORMAT.md).
    page.html's component markup applies (ARTIFACTS.md); because of the banner above,
    individual ◆ asides appear only for kinds Critique, Source, and Diagram.
    Foundations checks render as their two italic lines, so the printed page stays
    self-testable.

    Embedded widget (interactive; ~1–2 per section guide, preference-gated). Announce it
    in the sister markdown as a ◆ Diagram blockquote describing the demonstration and
    linking this page's #wN anchor. Style and script stay inline in THIS page — shared
    assets never change for a widget:

      <aside class="beyond" data-kind="diagram" id="w1">
        <p class="beyond-kicker">◆ Beyond the book · Diagram — interactive</p>
        <p class="lab-lede">One line: what to drag, and what to notice.</p>
        <div class="lab">
          <canvas width="560" height="360"></canvas>
          <div class="lab-side"><!-- sliders / readouts / buttons --></div>
        </div>
      </aside>

    Scoped widget CSS, once per page that uses widgets (in a <style> before the first):
      .lab{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-start}
      .lab canvas{max-width:100%;border:1px solid #d6d2c8;border-radius:6px;background:#fff}
      .lab .lab-side{display:flex;flex-direction:column;gap:.45rem;min-width:11rem;font-size:.85rem}
    Draw with theme-safe colors (read them from getComputedStyle for --ink/--accent, with
    literal fallbacks), redraw on input events, no external libraries.
  -->

  <footer class="colophon">Generated by chapterhouse · {{PASS_BADGE}} guide · {{GENERATED_DATE}}. Written by an AI study partner as pre-reading support. Unmarked content on this page is the study partner's teaching, not the book's — the book's own words appear only in quotation marks with page anchors. Verify against the original book before citing. · <a href="{{SISTER_MD}}">Markdown version</a></footer>

</main>
</body>
</html>
