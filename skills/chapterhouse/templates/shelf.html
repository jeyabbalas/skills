<body>
<main class="page">

  <header class="masthead chrome">
    <nav class="crumbs" aria-label="Breadcrumb"><span>Shelf</span></nav>
    <span class="chip">Study hall</span>
  </header>

  <h1>{{TITLE}}</h1>
  <p class="subtitle"><!-- slot: subtitle — e.g. “2 books · 14 items due · last touched 2026-08-23” --></p>

  <!-- slot: filter — include ONLY when the shelf holds 6+ books:
    <input class="filter chrome" type="search" placeholder="Filter books…" data-filter="#books" aria-label="Filter books">
    <p class="filter-count" aria-live="polite"></p>
  -->

  <div class="cards" id="books">
    <!-- slot: cards — one per book, most recently touched first; a concepts card when
         concepts/ is non-empty. The due count comes from `revise.py due` at regeneration
         (drop the span when zero).
      <article class="card" data-tags="statistics, python">
        <h3><a href="books/downey2014-think-stats/index.html">Think Stats</a></h3>
        <p class="who">Downey · 2nd ed. · 2014</p>
        <p>One-line gist from SHELF.md.</p>
        <p class="passes"><span class="done">● recited 2/13</span>
          <span class="now">◐ ch 3 · pass-2</span> <span class="todo">○ 12 due</span></p>
      </article>
      <article class="card">
        <h3><a href="concepts/index.html">Concepts</a></h3>
        <p>Cross-book concept notes — the syntopical shelf.</p>
      </article>
    -->
  </div>

  <footer class="colophon">Generated by chapterhouse · shelf index · {{GENERATED_DATE}}. Written by an AI study partner. Unmarked content restates the books; anything marked “Beyond the book” is added interpretation. Verify against the original books before citing. · <a href="{{SISTER_MD}}">Markdown version</a></footer>

</main>
</body>
</html>
